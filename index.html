<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>飞行汽车课程作业</title><style>
:root{--navy:#183b63;--blue:#285f91;--light:#eef4fa;--line:#d8e1ea;--text:#243447;--muted:#64748b;--paper:#fff;--soft:#f7f9fc;--green:#eaf5ef;--orange:#fff4e5;--red:#fbecec}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:#f2f5f8;color:var(--text);font:16px/1.8 "Microsoft YaHei","PingFang SC",Arial,sans-serif}

header{background:var(--navy);color:#fff}

nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}

p{margin:8px 0 12px}
.lead{font-size:17px;color:#40566d}
.small{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:15px 0}

.card{border:1px solid var(--line);border-radius:8px;padding:15px 17px;background:var(--soft)}

th{background:#eaf1f7;color:#244766;font-weight:700}

.tablewrap{overflow-x:auto}
.note{padding:13px 16px;border-left:4px solid #5d88b1;background:#f0f5fa;border-radius:0 7px 7px 0;margin:13px 0;color:#41576e;font-size:14px}
.warn{border-left-color:#d59a37;background:var(--orange)}
.good{border-left-color:#4b9771;background:var(--green)}
.bad{border-left-color:#c75a5a;background:var(--red)}
.diagram{border:1px solid var(--line);background:#fbfcfe;border-radius:8px;padding:16px;margin:13px 0;overflow:auto}
.diagram svg{display:block;max-width:100%;height:auto;margin:auto}
.pill{display:inline-block;background:#eaf1f7;color:#315779;padding:2px 8px;border-radius:4px;font-size:12px;margin:2px}
.refs{display:grid;gap:10px}
.ref{border-bottom:1px solid var(--line);padding:9px 0}
.ref:last-child{border:0}
.ref b{display:block;color:#2b4661;font-size:14px}
.ref a{font-size:13px;word-break:break-all}
footer{max-width:1180px;margin:0 auto 35px;padding:18px 26px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
